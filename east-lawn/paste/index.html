.ellp,.ellp *,.ellp *::before,.ellp *::after{box-sizing:border-box}
.ellp{--g:#384920;--g2:#5A762B;--cream:#F5F0E4;--gold:#E8CA64;--ink:#000;--char:#2c2a29;--line:rgba(56,73,32,.16);--serif:&#x27;Libre Baskerville&#x27;,Georgia,&#x27;Times New Roman&#x27;,serif;--sans:&#x27;Helvetica Neue&#x27;,Helvetica,Arial,sans-serif;--ui:&#x27;Kling&#x27;,&#x27;Helvetica Neue&#x27;,Helvetica,Arial,sans-serif;margin:0;padding:0;background:#fff;color:var(--char);font-family:var(--sans);font-weight:700;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;text-align:left;overflow-x:clip}

.ellp .ellp-h1,.ellp .ellp-h2,.ellp .ellp-h3{font-family:var(--serif);font-weight:400;color:var(--g);letter-spacing:-.01em;margin:0;text-transform:none}

.ellp .ellp-muted{color:#4a4744}

.ellp a.ellp-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--ui);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border-radius:36px;padding:16px 30px;background:var(--g);color:#fff;border:2px solid var(--g);line-height:1.1;transition:background .2s,color .2s,border-color .2s}

.ellp a.ellp-btn--ghost:hover,.ellp a.ellp-btn--ghost:focus{background:var(--g);color:#fff}
.ellp .ellp-ico{width:18px;height:18px;flex:0 0 auto;fill:currentColor}

.ellp .ellp-hdr{background:var(--cream);border-bottom:1px solid var(--line)}
.ellp .ellp-hdr .ellp-wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}

.ellp .ellp-trust li:nth-child(2n){border-right:0}
.ellp .ellp-trust strong{display:block;font-family:var(--serif);font-weight:400;font-size:20px;color:var(--gold);margin-bottom:4px}

.ellp .ellp-sec-head .ellp-h2{margin-bottom:14px}

.ellp .ellp-radio{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.ellp .ellp-seg{display:inline-grid;grid-template-columns:1fr 1fr;width:100%;max-width:440px;padding:5px;border-radius:40px;background:#fff;border:1px solid var(--line);margin:0 0 34px}
.ellp .ellp-seg label{display:block;text-align:center;cursor:pointer;font-family:var(--ui);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;padding:14px 10px;border-radius:32px;color:var(--g);transition:background .2s,color .2s;user-select:none}
.ellp #ellp-burial:checked~.ellp-seg label[for=&quot;ellp-burial&quot;],.ellp #ellp-cremation:checked~.ellp-seg label[for=&quot;ellp-cremation&quot;]{background:var(--g);color:#fff}

.ellp .ellp-panel{display:none}

.ellp .ellp-feature{display:grid;gap:26px;margin:0 0 46px}
.ellp .ellp-feature-media{display:grid;gap:12px;grid-template-columns:1fr 1fr}

.ellp .ellp-feature-media img{width:100%;aspect-ratio:3/2;object-fit:cover}
.ellp .ellp-feature-media figcaption{position:absolute;left:10px;bottom:10px;background:rgba(245,240,228,.94);color:var(--g);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:20px;font-family:var(--ui)}
.ellp .ellp-feature-text .ellp-h3{font-size:25px;margin-bottom:14px}

.ellp .ellp-checks li{position:relative;padding-left:26px;margin:0 0 9px}

.ellp .ellp-sub-h{font-family:var(--ui);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--g2);margin:0 0 16px}

    &lt;p class=&quot;ellp-eyebrow&quot;&gt;Welcome to our Elk Grove location&lt;/p&gt;
    &lt;h2 class=&quot;ellp-h2&quot; id=&quot;ellp-loc-h&quot; style=&quot;margin-bottom:18px&quot;&gt;East Lawn Elk Grove Memorial Park &amp;amp; Mortuary&lt;/h2&gt;
    &lt;p&gt;East Lawn Memorial Park in Elk Grove offers a peaceful, open sanctuary for families in the Sacramento area. Founded in 1963, this 100+ acre cemetery and mortuary embraces the grace of California&#x27;s foothills with broad expanses, gentle ponds, and a calming waterfall, creating a pristine environment for reflection and remembrance.&lt;/p&gt;
    &lt;p&gt;With a chapel for services and beautiful grounds for burial and niches, our compassionate team provides dignified care for funerals, memorials, cremation coordination, and pre-planning. We serve all backgrounds and faiths in a serene setting that honors your loved one&#x27;s legacy.&lt;/p&gt;
    &lt;p class=&quot;ellp-sub-h&quot; style=&quot;margin-top:28px&quot;&gt;Services at this location&lt;/p&gt;
    &lt;ul class=&quot;ellp-checks ellp-svc&quot;&gt;
     &lt;li&gt;Traditional funerals and celebrations of life&lt;/li&gt;
     &lt;li&gt;Memorial services and graveside tributes&lt;/li&gt;
     &lt;li&gt;Burial in ground plots, crypts, or niches&lt;/li&gt;
     &lt;li&gt;Cremation coordination (with services at our East Sacramento crematory)&lt;/li&gt;
     &lt;li&gt;Video recording/live streaming and keepsake jewelry&lt;/li&gt;
     &lt;li&gt;Pre-planning guidance&lt;/li&gt;
    &lt;/ul&gt;
   &lt;/div&gt;
   &lt;div class=&quot;ellp-fac&quot;&gt;

  &lt;div class=&quot;ellp-faq&quot;&gt;
   &lt;details open&gt;&lt;summary&gt;What should I do immediately when a loved one passes away?&lt;/summary&gt;&lt;p&gt;Call East Lawn right away. We are available 24/7 to serve families across Sacramento, Roseville, and Elk Grove. We will transfer your loved one into our care, gather necessary information, and guide you through service planning. For Elk Grove, call &lt;a href=&quot;tel:+19167322031&quot;&gt;(916) 732-2031&lt;/a&gt;.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Can we have a funeral service if we choose cremation?&lt;/summary&gt;&lt;p&gt;Yes. Our Traditional Service includes visitation, a funeral service with your loved one present, and cremation afterward. Cremation may take place before or after the funeral.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Does East Lawn have its own crematory?&lt;/summary&gt;&lt;p&gt;Yes. East Lawn operates its own crematory, ensuring that your loved one never leaves our care. Cremation is performed at our owned East Sacramento crematory.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Can family members witness the cremation?&lt;/summary&gt;&lt;p&gt;Yes. Families are welcome to witness the cremation if they choose.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Can services be held on weekends or evenings?&lt;/summary&gt;&lt;p&gt;Yes. We accommodate weekend and evening services for families throughout the greater Sacramento area.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Does East Lawn accept life insurance?&lt;/summary&gt;&lt;p&gt;Yes, we work directly with life insurance companies on behalf of families in the Sacramento region.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What is the difference between a funeral, a memorial service, and a celebration of life?&lt;/summary&gt;&lt;p&gt;A funeral usually has the body or ashes present, often followed by burial or cremation. A memorial service is similar but without the body. A celebration of life is typically less formal and focuses on sharing stories and memories.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;We have a pre-need policy from another funeral home. Can East Lawn help?&lt;/summary&gt;&lt;p&gt;Yes. We honor and accept preneed funeral policies from other funeral homes.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;

&lt;section class=&quot;ellp-sec ellp-sec--cream&quot; aria-labelledby=&quot;ellp-loc-h&quot;&gt;
 &lt;div class=&quot;ellp-wrap&quot;&gt;
  &lt;div class=&quot;ellp-loc&quot;&gt;
   &lt;div&gt;
    &lt;p class=&quot;ellp-eyebrow&quot;&gt;Welcome to our East Sacramento location&lt;/p&gt;
    &lt;h2 class=&quot;ellp-h2&quot; id=&quot;ellp-loc-h&quot; style=&quot;margin-bottom:18px&quot;&gt;East Lawn Memorial Park, East Sacramento&lt;/h2&gt;
    &lt;p&gt;East Lawn Memorial Park in East Sacramento is our flagship cemetery and mortuary, proudly serving families since 1904. This Sacramento landmark spans beautiful grounds and offers a peaceful final resting place for people of all backgrounds, faiths, and cultures.&lt;/p&gt;
    &lt;p&gt;With historic chapels, an on-site crematory, elegant mausoleums, and welcoming reception spaces, we provide compassionate, full-service care in one serene location. Whether arranging a funeral, cremation, burial, or pre-planning, our dedicated team ensures every detail honors your loved one&#x27;s legacy.&lt;/p&gt;
    &lt;p class=&quot;ellp-sub-h&quot; style=&quot;margin-top:28px&quot;&gt;Services at this location&lt;/p&gt;
    &lt;ul class=&quot;ellp-checks ellp-svc&quot;&gt;
     &lt;li&gt;Traditional funerals and celebrations of life&lt;/li&gt;
     &lt;li&gt;Cremation services (including witness options) at our on-site crematory&lt;/li&gt;
     &lt;li&gt;Burial in ground plots, crypts, or niches&lt;/li&gt;
     &lt;li&gt;Receptions and catering coordination&lt;/li&gt;
     &lt;li&gt;Video recording/live streaming and keepsake jewelry&lt;/li&gt;
     &lt;li&gt;Pre-planning guidance&lt;/li&gt;

&lt;section class=&quot;ellp-sec&quot; aria-labelledby=&quot;ellp-faq-h&quot;&gt;
 &lt;div class=&quot;ellp-wrap&quot;&gt;

  &lt;div class=&quot;ellp-faq&quot;&gt;
   &lt;details open&gt;&lt;summary&gt;What should I do immediately when a loved one passes away?&lt;/summary&gt;&lt;p&gt;Call East Lawn right away. We are available 24/7 to serve families across Sacramento, Roseville, and Elk Grove. We will transfer your loved one into our care, gather necessary information, and guide you through service planning. For East Sacramento, call &lt;a href=&quot;tel:+19167322000&quot;&gt;(916) 732-2000&lt;/a&gt;.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Can we have a funeral service if we choose cremation?&lt;/summary&gt;&lt;p&gt;Yes. Our Traditional Service includes visitation, a funeral service with your loved one present, and cremation afterward. Cremation may take place before or after the funeral.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Does East Lawn have its own crematory?&lt;/summary&gt;&lt;p&gt;Yes. East Lawn operates its own crematory, ensuring that your loved one never leaves our care. Cremation is performed at our on-site crematory here at East Sacramento.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Can family members witness the cremation?&lt;/summary&gt;&lt;p&gt;Yes. Families are welcome to witness the cremation if they choose.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Can services be held on weekends or evenings?&lt;/summary&gt;&lt;p&gt;Yes. We accommodate weekend and evening services for families throughout the greater Sacramento area.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Does East Lawn accept life insurance?&lt;/summary&gt;&lt;p&gt;Yes, we work directly with life insurance companies on behalf of families in the Sacramento region.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What is the difference between a funeral, a memorial service, and a celebration of life?&lt;/summary&gt;&lt;p&gt;A funeral usually has the body or ashes present, often followed by burial or cremation. A memorial service is similar but without the body. A celebration of life is typically less formal and focuses on sharing stories and memories.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;We have a pre-need policy from another funeral home. Can East Lawn help?&lt;/summary&gt;&lt;p&gt;Yes. We honor and accept preneed funeral policies from other funeral homes.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

.ellp,.ellp *,.ellp *::before,.ellp *::after{box-sizing:border-box}
.ellp{--g:#384920;--g2:#5A762B;--cream:#F5F0E4;--gold:#E8CA64;--ink:#000;--char:#2c2a29;--line:rgba(56,73,32,.16);--serif:&#x27;Libre Baskerville&#x27;,Georgia,&#x27;Times New Roman&#x27;,serif;--sans:&#x27;Helvetica Neue&#x27;,Helvetica,Arial,sans-serif;--ui:&#x27;Kling&#x27;,&#x27;Helvetica Neue&#x27;,Helvetica,Arial,sans-serif;margin:0;padding:0;background:#fff;color:var(--char);font-family:var(--sans);font-weight:700;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;text-align:left;overflow-x:clip}

.ellp .ellp-wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 22px}
.ellp .ellp-h1,.ellp .ellp-h2,.ellp .ellp-h3{font-family:var(--serif);font-weight:400;color:var(--g);letter-spacing:-.01em;margin:0;text-transform:none}

/* buttons */

.ellp .ellp-sticky a.ellp-btn{width:100%;padding:15px 20px}
.ellp .ellp-sticky-pad{height:calc(78px + env(safe-area-inset-bottom))}
@media (min-width:600px){
 .ellp .ellp-trust ul{grid-template-columns:repeat(4,1fr)}
 .ellp .ellp-trust li{border-bottom:0}
 .ellp .ellp-trust li:nth-child(2n){border-right:1px solid rgba(255,255,255,.14)}
 .ellp .ellp-trust li:last-child{border-right:0}
 .ellp .ellp-cards{grid-template-columns:1fr 1fr}
 .ellp .ellp-rest{grid-template-columns:repeat(3,1fr)}
 .ellp .ellp-steps{grid-template-columns:repeat(3,1fr)}
  .ellp .ellp-ftr .ellp-wrap{grid-template-columns:1fr 1fr 1fr}
 .ellp .ellp-hdr-call .ellp-lbl{display:inline}
}
@media (min-width:761px){

}
@media (min-width:960px){

 .ellp .ellp-wrap{padding:0 40px}
 .ellp .ellp-hdr .ellp-wrap{min-height:84px}
 .ellp .ellp-logo img{width:168px}
 .ellp .ellp-nav{display:flex;gap:34px;margin-left:auto;margin-right:16px}
 .ellp .ellp-hero{display:grid;grid-template-columns:minmax(0,11fr) minmax(0,13fr);min-height:min(760px,calc(100vh - 84px))}
 .ellp .ellp-hero-body{order:1;display:flex;flex-direction:column;justify-content:center;padding:64px 56px 64px max(40px,calc((100vw - 1200px)/2 + 40px))}
 .ellp .ellp-hero-media{order:2;aspect-ratio:auto;height:100%}
 .ellp .ellp-hero .ellp-h1{font-size:46px;line-height:1.14;margin-bottom:18px}
 .ellp .ellp-hero-sub{font-size:18px;margin-bottom:30px}
 .ellp a.ellp-btn--lg{width:auto;align-self:flex-start;min-width:340px}
 .ellp .ellp-247{justify-content:flex-start}
 .ellp .ellp-h2{font-size:38px}
 .ellp .ellp-sec{padding:104px 0}
 .ellp .ellp-sec-head{margin-bottom:40px}
 .ellp .ellp-feature{grid-template-columns:7fr 5fr;gap:56px;align-items:center;margin-bottom:64px}
 .ellp .ellp-feature-text .ellp-h3{font-size:30px}
 .ellp .ellp-cards{grid-template-columns:repeat(3,1fr);gap:22px}
 .ellp .ellp-cards--2 {grid-template-columns:repeat(2,1fr)}
 .ellp .ellp-panel-cta{grid-template-columns:1fr auto;padding:34px 40px}
 .ellp .ellp-loc{grid-template-columns:5fr 7fr;gap:64px;align-items:start}
  .ellp .ellp-close{padding:96px 0}
}
@media (prefers-reduced-motion:reduce){.ellp *{transition:none!important}}

 &lt;div class=&quot;ellp-wrap&quot;&gt;
  &lt;div class=&quot;ellp-sec-head&quot;&gt;
   &lt;p class=&quot;ellp-eyebrow&quot;&gt;Your options at Greenback &amp;amp; I-80&lt;/p&gt;
   &lt;h2 class=&quot;ellp-h2&quot; id=&quot;ellp-opt-h&quot;&gt;Burial or cremation, with care at every step&lt;/h2&gt;
   &lt;p class=&quot;ellp-lede&quot;&gt;Both are offered at East Lawn Greenback &amp;amp; I-80. Choose one to see how we can help, then call and a counselor will walk you through it.&lt;/p&gt;
  &lt;/div&gt;

  &lt;div class=&quot;ellp-opt&quot; role=&quot;group&quot; aria-labelledby=&quot;ellp-opt-h&quot;&gt;
   &lt;input class=&quot;ellp-radio&quot; type=&quot;radio&quot; name=&quot;ellp-option&quot; id=&quot;ellp-burial&quot; value=&quot;burial&quot; checked&gt;

   &lt;!-- BURIAL PANEL --&gt;
   &lt;div class=&quot;ellp-panel ellp-panel--burial&quot;&gt;
    &lt;div class=&quot;ellp-feature&quot;&gt;
     &lt;div class=&quot;ellp-feature-media&quot;&gt;
      &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/Sierra-Hills-Cemetery-1-1024x683.webp&quot; srcset=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/Sierra-Hills-Cemetery-1-768x512.webp 768w, https://www.eastlawn.com/wp-content/uploads/2026/01/Sierra-Hills-Cemetery-1-1024x683.webp 1024w&quot; sizes=&quot;(min-width: 960px) 640px, 100vw&quot; width=&quot;1024&quot; height=&quot;683&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Lawn and willow trees at East Lawn Sierra Hills Cemetery&quot;&gt;&lt;figcaption&gt;Sierra Hills Cemetery&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/Veterans-Memorial-at-GI80-1-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Veterans Memorial at East Lawn Sierra Hills in Greenback&quot;&gt;&lt;figcaption&gt;Veterans Memorial&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/HYPX-EL-10-23-53-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Outdoor mausoleum at East Lawn Sierra Hills&quot;&gt;&lt;figcaption&gt;Outdoor mausoleum&lt;/figcaption&gt;&lt;/figure&gt;
     &lt;/div&gt;
     &lt;div class=&quot;ellp-feature-text&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;A funeral home and cemetery in one place&lt;/h3&gt;
      &lt;p&gt;East Lawn Sierra Hills Memorial Park offers a peaceful, expansive sanctuary of over 70 acres of rolling hills, with stunning views of the snow-capped Sierra Nevada peaks. A chapel for services, indoor and outdoor mausoleums and an urn garden are all on site.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Services in our Greenback chapel or at the graveside&lt;/li&gt;
       &lt;li&gt;In-ground plots, indoor and outdoor mausoleum crypts and urn niches&lt;/li&gt;
       &lt;li&gt;We serve all backgrounds and faiths&lt;/li&gt;
      &lt;/ul&gt;
     &lt;/div&gt;
    &lt;/div&gt;

    &lt;p class=&quot;ellp-sub-h&quot;&gt;Burial services&lt;/p&gt;
    &lt;div class=&quot;ellp-cards&quot;&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Traditional Package&lt;/h3&gt;
      &lt;p&gt;A visitation, a funeral service and a committal service at the cemetery.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Visitation at East Lawn or another location&lt;/li&gt;
       &lt;li&gt;Funeral service at East Lawn or another location&lt;/li&gt;
       &lt;li&gt;Coach (hearse) and committal service at the cemetery&lt;/li&gt;
       &lt;li&gt;Embalming, care and preparation&lt;/li&gt;
       &lt;li&gt;Online funeral notice and obituary&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322020&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Service at Cemetery&lt;/h3&gt;
      &lt;p&gt;A graveside, cryptside or nicheside service at the final resting place.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Committal service at the cemetery&lt;/li&gt;
       &lt;li&gt;Coach (hearse)&lt;/li&gt;
       &lt;li&gt;Care and preparation&lt;/li&gt;
       &lt;li&gt;Online funeral notice and obituary&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322020&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Immediate Burial&lt;/h3&gt;
      &lt;p&gt;Burial without a ceremony, scheduled by the funeral home. Family attendance at the grave is not included.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Transfer of your loved one into our care&lt;/li&gt;
       &lt;li&gt;Care and preparation&lt;/li&gt;
       &lt;li&gt;Coach (hearse)&lt;/li&gt;
       &lt;li&gt;Online funeral notice and obituary&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322020&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
    &lt;/div&gt;

    &lt;p class=&quot;ellp-sub-h&quot;&gt;Places of rest at Sierra Hills&lt;/p&gt;
    &lt;ul class=&quot;ellp-rest&quot;&gt;
     &lt;li&gt;&lt;strong&gt;Ground burial&lt;/strong&gt;Beautiful in-ground burial plots across our rolling cemetery lawns, for full-body or urn placement.&lt;/li&gt;
     &lt;li&gt;&lt;strong&gt;Crypts&lt;/strong&gt;Above-ground placement in our indoor and outdoor mausoleums, offering protection and easy visitation.&lt;/li&gt;
     &lt;li&gt;&lt;strong&gt;Urn niches&lt;/strong&gt;Urn niches and an urn garden at Sierra Hills, a lasting place of tribute.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;div class=&quot;ellp-panel-cta&quot;&gt;
     &lt;p&gt;A family service counselor can explain every burial option and help you decide.&lt;/p&gt;
     &lt;a class=&quot;ellp-btn ellp-btn--light&quot; href=&quot;tel:+19167322020&quot;&gt;Call (916) 732-2020&lt;/a&gt;
    &lt;/div&gt;

   &lt;!-- CREMATION PANEL --&gt;
   &lt;div class=&quot;ellp-panel ellp-panel--cremation&quot;&gt;
    &lt;div class=&quot;ellp-feature&quot;&gt;
     &lt;div class=&quot;ellp-feature-media&quot;&gt;

      &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2025/12/SIerra-Hills-Chapel-WebP-Homepage-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Chapel with rows of seating and a piano at East Lawn Sierra Hills&quot;&gt;&lt;figcaption&gt;Chapel&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/HYPX-East-Lawn-1-25-14-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Reception room with tables at East Lawn Sierra Hills&quot;&gt;&lt;figcaption&gt;Reception room&lt;/figcaption&gt;&lt;/figure&gt;
     &lt;/div&gt;
     &lt;div class=&quot;ellp-feature-text&quot;&gt;
      &lt;div class=&quot;ellp-callout&quot;&gt;
       &lt;h3 class=&quot;ellp-h3&quot;&gt;You can have a full funeral service with cremation.&lt;/h3&gt;
      &lt;/div&gt;
      &lt;p&gt;Choosing cremation does not mean giving up a service. Families can hold a visitation and a funeral with their loved one present, with cremation afterward. Cremation may take place before or after the funeral.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Performed at our owned East Sacramento crematory, so your loved one never leaves our care&lt;/li&gt;
       &lt;li&gt;Families are welcome to witness the cremation&lt;/li&gt;
       &lt;li&gt;Services in our Greenback chapel, at the graveside or in the urn garden&lt;/li&gt;
      &lt;/ul&gt;
     &lt;/div&gt;
    &lt;/div&gt;

    &lt;p class=&quot;ellp-sub-h&quot;&gt;Cremation services&lt;/p&gt;
    &lt;div class=&quot;ellp-cards&quot;&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Traditional Service&lt;/h3&gt;
      &lt;p&gt;Visitation, a funeral service with your loved one present, and cremation afterward, for families who want a full ceremony and farewell.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Visitation at East Lawn or another location&lt;/li&gt;
       &lt;li&gt;Funeral service at East Lawn or another location&lt;/li&gt;
       &lt;li&gt;Use of AV equipment&lt;/li&gt;
       &lt;li&gt;Cremation, with a witness option&lt;/li&gt;
       &lt;li&gt;Online funeral notice and obituary&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322020&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Service At Cemetery&lt;/h3&gt;
      &lt;p&gt;A serene graveside, cryptside or nicheside committal service following cremation.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Cremation, with a witness option&lt;/li&gt;
       &lt;li&gt;Committal service at the cemetery&lt;/li&gt;
       &lt;li&gt;Care and preparation&lt;/li&gt;
       &lt;li&gt;Online funeral notice and obituary&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322020&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Remembrance Package&lt;/h3&gt;
      &lt;p&gt;A memorial service without the body present, centered on sharing tributes, memories and gatherings to honor your loved one&#x27;s life.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Memorial service at East Lawn or another location&lt;/li&gt;
       &lt;li&gt;Use of AV equipment&lt;/li&gt;
       &lt;li&gt;Cremation, with a witness option&lt;/li&gt;
       &lt;li&gt;Online funeral notice and obituary&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322020&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ellp-cards ellp-cards--2&quot;&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Respect Package&lt;/h3&gt;
      &lt;p&gt;A thoughtful direct cremation option with identification viewing and an engraved urn. No ceremony is included.&lt;/p&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322020&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Direct Cremation&lt;/h3&gt;
      &lt;p&gt;A respectful option without ceremony or viewing, using an alternative container.&lt;/p&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322020&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
    &lt;/div&gt;

    &lt;div class=&quot;ellp-panel-cta&quot;&gt;
     &lt;p&gt;A family service counselor can explain every cremation option and help you decide.&lt;/p&gt;
     &lt;a class=&quot;ellp-btn ellp-btn--light&quot; href=&quot;tel:+19167322020&quot;&gt;Call (916) 732-2020&lt;/a&gt;
    &lt;/div&gt;
   &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;

&lt;section class=&quot;ellp-sec&quot; aria-labelledby=&quot;ellp-steps-h&quot;&gt;
 &lt;div class=&quot;ellp-wrap&quot;&gt;
  &lt;div class=&quot;ellp-sec-head&quot;&gt;
   &lt;p class=&quot;ellp-eyebrow&quot;&gt;If a death has occurred&lt;/p&gt;
   &lt;h2 class=&quot;ellp-h2&quot; id=&quot;ellp-steps-h&quot;&gt;What happens when you call&lt;/h2&gt;
  &lt;/div&gt;
  &lt;ol class=&quot;ellp-steps&quot; style=&quot;list-style:none;margin:0;padding:0&quot;&gt;
   &lt;li&gt;&lt;h3 class=&quot;ellp-h3&quot;&gt;Call us, day or night&lt;/h3&gt;&lt;p&gt;We are available 24/7 for immediate needs at &lt;a href=&quot;tel:+19167322020&quot;&gt;(916) 732-2020&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h3 class=&quot;ellp-h3&quot;&gt;We bring your loved one into our care&lt;/h3&gt;&lt;p&gt;We transfer your loved one into our care and gather the information we need.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h3 class=&quot;ellp-h3&quot;&gt;We guide you through planning&lt;/h3&gt;&lt;p&gt;We guide you through service planning, at a pace that is right for your family.&lt;/p&gt;&lt;/li&gt;

&lt;section class=&quot;ellp-sec ellp-sec--cream&quot; aria-labelledby=&quot;ellp-loc-h&quot;&gt;
 &lt;div class=&quot;ellp-wrap&quot;&gt;
  &lt;div class=&quot;ellp-loc&quot;&gt;
   &lt;div&gt;
    &lt;p class=&quot;ellp-eyebrow&quot;&gt;Welcome to our Greenback &amp;amp; I-80 location&lt;/p&gt;
    &lt;h2 class=&quot;ellp-h2&quot; id=&quot;ellp-loc-h&quot; style=&quot;margin-bottom:18px&quot;&gt;East Lawn Mortuary &amp;amp; Sierra Hills Memorial Park&lt;/h2&gt;
    &lt;p&gt;East Lawn Sierra Hills Memorial Park in Greenback &amp;amp; I-80 offers a peaceful, expansive sanctuary for families in the Sacramento area. Founded in 1957 with over 70 acres of rolling hills, this beautiful cemetery and mortuary embraces the grace of California&#x27;s foothills, featuring stunning views of the snow-capped Sierra Nevada peaks.&lt;/p&gt;
    &lt;p&gt;With a chapel for services, a welcoming reception room, indoor and outdoor mausoleums, an urn garden, and the East Lawn Mortuary added in 1972, our compassionate team provides dignified care for funerals, memorials, burials, cremation coordination, receptions, and pre-planning. We serve all backgrounds and faiths in a gentle, well-maintained setting that honors your loved one&#x27;s legacy.&lt;/p&gt;
    &lt;p class=&quot;ellp-sub-h&quot; style=&quot;margin-top:28px&quot;&gt;Services at this location&lt;/p&gt;
    &lt;ul class=&quot;ellp-checks ellp-svc&quot;&gt;
     &lt;li&gt;Traditional funerals and celebrations of life&lt;/li&gt;
     &lt;li&gt;Memorial services and graveside tributes&lt;/li&gt;
     &lt;li&gt;Burial in ground plots, crypts, or niches&lt;/li&gt;
     &lt;li&gt;Receptions with catering coordination in our on-site reception room&lt;/li&gt;
     &lt;li&gt;Cremation coordination (with services at our East Sacramento crematory)&lt;/li&gt;
     &lt;li&gt;Video recording/live streaming and keepsake jewelry&lt;/li&gt;
     &lt;li&gt;Pre-planning guidance&lt;/li&gt;
    &lt;/ul&gt;
   &lt;/div&gt;
   &lt;div class=&quot;ellp-fac&quot;&gt;
    &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/HYPX-East-Lawn-1-25-18-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Inside the chapel at East Lawn Sierra Hills, with rows of seating under a timbered ceiling&quot;&gt;&lt;figcaption&gt;&lt;strong&gt;Chapel&lt;/strong&gt;&lt;span&gt;Elegant space for meaningful services.&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/East-Lawn-Greenback-Receptions-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Reception room with round tables at East Lawn Sierra Hills&quot;&gt;&lt;figcaption&gt;&lt;strong&gt;Reception room&lt;/strong&gt;&lt;span&gt;Warm, flexible hall for post-service gatherings.&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/HYPX-EL-10-23-38-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Headstones on the lawn at East Lawn Sierra Hills Cemetery&quot;&gt;&lt;figcaption&gt;&lt;strong&gt;Cemetery&lt;/strong&gt;&lt;span&gt;Over 70 acres of pristine, open spaces.&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/HYPX-EL-10-23-34-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Sierra Vista Arches at East Lawn Sierra Hills&quot;&gt;&lt;figcaption&gt;&lt;strong&gt;Features&lt;/strong&gt;&lt;span&gt;Outdoor installations and tributes.&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
   &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;ellp-sec&quot; aria-labelledby=&quot;ellp-faq-h&quot;&gt;
 &lt;div class=&quot;ellp-wrap&quot;&gt;
  &lt;div class=&quot;ellp-sec-head&quot;&gt;
   &lt;p class=&quot;ellp-eyebrow&quot;&gt;Questions families ask&lt;/p&gt;
   &lt;h2 class=&quot;ellp-h2&quot; id=&quot;ellp-faq-h&quot;&gt;Frequently asked questions&lt;/h2&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ellp-faq&quot;&gt;
   &lt;details open&gt;&lt;summary&gt;What should I do immediately when a loved one passes away?&lt;/summary&gt;&lt;p&gt;Call East Lawn right away. We are available 24/7 to serve families across Sacramento, Roseville, and Elk Grove. We will transfer your loved one into our care, gather necessary information, and guide you through service planning. For Greenback &amp;amp; I-80, call &lt;a href=&quot;tel:+19167322020&quot;&gt;(916) 732-2020&lt;/a&gt;.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Can we have a funeral service if we choose cremation?&lt;/summary&gt;&lt;p&gt;Yes. Our Traditional Service includes visitation, a funeral service with your loved one present, and cremation afterward. Cremation may take place before or after the funeral.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Does East Lawn have its own crematory?&lt;/summary&gt;&lt;p&gt;Yes. East Lawn operates its own crematory, ensuring that your loved one never leaves our care. Cremation is performed at our owned East Sacramento crematory.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Can family members witness the cremation?&lt;/summary&gt;&lt;p&gt;Yes. Families are welcome to witness the cremation if they choose.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Can services be held on weekends or evenings?&lt;/summary&gt;&lt;p&gt;Yes. We accommodate weekend and evening services for families throughout the greater Sacramento area.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Does East Lawn accept life insurance?&lt;/summary&gt;&lt;p&gt;Yes, we work directly with life insurance companies on behalf of families in the Sacramento region.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What is the difference between a funeral, a memorial service, and a celebration of life?&lt;/summary&gt;&lt;p&gt;A funeral usually has the body or ashes present, often followed by burial or cremation. A memorial service is similar but without the body. A celebration of life is typically less formal and focuses on sharing stories and memories.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;We have a pre-need policy from another funeral home. Can East Lawn help?&lt;/summary&gt;&lt;p&gt;Yes. We honor and accept preneed funeral policies from other funeral homes.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

 &lt;div class=&quot;ellp-wrap&quot;&gt;

.ellp,.ellp *,.ellp *::before,.ellp *::after{box-sizing:border-box}
.ellp{--g:#384920;--g2:#5A762B;--cream:#F5F0E4;--gold:#E8CA64;--ink:#000;--char:#2c2a29;--line:rgba(56,73,32,.16);--serif:&#x27;Libre Baskerville&#x27;,Georgia,&#x27;Times New Roman&#x27;,serif;--sans:&#x27;Helvetica Neue&#x27;,Helvetica,Arial,sans-serif;--ui:&#x27;Kling&#x27;,&#x27;Helvetica Neue&#x27;,Helvetica,Arial,sans-serif;margin:0;padding:0;background:#fff;color:var(--char);font-family:var(--sans);font-weight:700;font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;text-align:left;overflow-x:clip}

.ellp .ellp-wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 22px}
.ellp .ellp-h1,.ellp .ellp-h2,.ellp .ellp-h3{font-family:var(--serif);font-weight:400;color:var(--g);letter-spacing:-.01em;margin:0;text-transform:none}

/* buttons */

.ellp .ellp-steps .ellp-h3{font-size:20px;margin-bottom:6px}
.ellp .ellp-steps p{margin:0;font-size:16px}
/* location */
.ellp .ellp-loc{display:grid;gap:30px;margin-bottom:44px}
.ellp .ellp-fac{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ellp .ellp-fac figure{margin:0}
.ellp .ellp-fac img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:#dfe3d6}
.ellp .ellp-fac figcaption{padding:12px 2px 0}
.ellp .ellp-fac figcaption strong{display:block;font-family:var(--serif);font-weight:400;font-size:18px;color:var(--g)}
.ellp .ellp-fac figcaption span{font-size:14.5px;color:#4a4744}
.ellp .ellp-svc{columns:1;margin:0 0 8px}
/* faq */
.ellp .ellp-faq{max-width:860px}
.ellp .ellp-faq details{border-bottom:1px solid var(--line)}
.ellp .ellp-faq details:first-child{border-top:1px solid var(--line)}
.ellp summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 6px 20px 0;font-family:var(--serif);font-weight:400;font-size:18px;line-height:1.45;color:var(--g)}
.ellp summary::-webkit-details-marker{display:none}
.ellp summary::after{content:&quot;&quot;;flex:0 0 auto;width:10px;height:10px;margin-top:-6px;border-right:2px solid var(--g2);border-bottom:2px solid var(--g2);transform:rotate(45deg);transition:transform .2s}
.ellp details[open]&gt;summary::after{margin-top:6px;transform:rotate(-135deg)}
.ellp .ellp-faq details p{padding:0 30px 8px 0;font-size:16.5px}
/* closing band */
.ellp .ellp-close{background:var(--g);color:#fff;text-align:center;padding:64px 0}
.ellp .ellp-close .ellp-h2{color:#fff;margin-bottom:12px}
.ellp .ellp-close p{color:rgba(255,255,255,.88);max-width:560px;margin:0 auto 26px}
.ellp .ellp-close .ellp-btn{max-width:420px}
/* footer */
.ellp .ellp-ftr{background:#2c2a29;color:rgba(255,255,255,.82);padding:44px 0 40px;font-size:15px}
.ellp .ellp-ftr .ellp-wrap{display:grid;gap:24px}
.ellp .ellp-ftr .ellp-ftr-h{font-family:var(--ui);font-weight:700;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.ellp .ellp-ftr p{margin:0}
.ellp .ellp-ftr a{color:#fff}
.ellp .ellp-ftr a:hover,.ellp .ellp-ftr a:focus{color:var(--gold)}
.ellp .ellp-ftr-base{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.14);padding-top:18px;font-size:13px;color:rgba(255,255,255,.62)}
/* sticky mobile call bar */
.ellp .ellp-sticky{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:rgba(245,240,228,.97);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.ellp .ellp-sticky{transition:transform .25s ease}
.ellp .ellp-sticky.ellp-sticky--hide{transform:translateY(110%)}
.ellp .ellp-sticky a.ellp-btn{width:100%;padding:15px 20px}
.ellp .ellp-sticky-pad{height:calc(78px + env(safe-area-inset-bottom))}
@media (min-width:600px){
 .ellp .ellp-trust ul{grid-template-columns:repeat(4,1fr)}
 .ellp .ellp-trust li{border-bottom:0}
 .ellp .ellp-trust li:nth-child(2n){border-right:1px solid rgba(255,255,255,.14)}
 .ellp .ellp-trust li:last-child{border-right:0}
 .ellp .ellp-cards{grid-template-columns:1fr 1fr}
 .ellp .ellp-rest{grid-template-columns:repeat(3,1fr)}
 .ellp .ellp-steps{grid-template-columns:repeat(3,1fr)}
  .ellp .ellp-ftr .ellp-wrap{grid-template-columns:1fr 1fr 1fr}
 .ellp .ellp-hdr-call .ellp-lbl{display:inline}
}
@media (min-width:761px){
 .ellp .ellp-sticky,.ellp .ellp-sticky-pad{display:none}
}
@media (min-width:960px){
 .ellp .ellp-eyebrow{font-size:12.5px;letter-spacing:.16em}
 .ellp{font-size:17.5px}
 .ellp .ellp-wrap{padding:0 40px}
 .ellp .ellp-hdr .ellp-wrap{min-height:84px}
 .ellp .ellp-logo img{width:168px}
 .ellp .ellp-nav{display:flex;gap:34px;margin-left:auto;margin-right:16px}
 .ellp .ellp-hero{display:grid;grid-template-columns:minmax(0,11fr) minmax(0,13fr);min-height:min(760px,calc(100vh - 84px))}
 .ellp .ellp-hero-body{order:1;display:flex;flex-direction:column;justify-content:center;padding:64px 56px 64px max(40px,calc((100vw - 1200px)/2 + 40px))}
 .ellp .ellp-hero-media{order:2;aspect-ratio:auto;height:100%}
 .ellp .ellp-hero .ellp-h1{font-size:46px;line-height:1.14;margin-bottom:18px}
 .ellp .ellp-hero-sub{font-size:18px;margin-bottom:30px}
 .ellp a.ellp-btn--lg{width:auto;align-self:flex-start;min-width:340px}
 .ellp .ellp-247{justify-content:flex-start}
 .ellp .ellp-h2{font-size:38px}
 .ellp .ellp-sec{padding:104px 0}
 .ellp .ellp-sec-head{margin-bottom:40px}
 .ellp .ellp-feature{grid-template-columns:7fr 5fr;gap:56px;align-items:center;margin-bottom:64px}
 .ellp .ellp-feature-text .ellp-h3{font-size:30px}
 .ellp .ellp-cards{grid-template-columns:repeat(3,1fr);gap:22px}
 .ellp .ellp-cards--2 {grid-template-columns:repeat(2,1fr)}
 .ellp .ellp-panel-cta{grid-template-columns:1fr auto;padding:34px 40px}
 .ellp .ellp-loc{grid-template-columns:5fr 7fr;gap:64px;align-items:start}
  .ellp .ellp-close{padding:96px 0}
}
@media (prefers-reduced-motion:reduce){.ellp *{transition:none!important}}

 &lt;div class=&quot;ellp-wrap&quot;&gt;
  &lt;div class=&quot;ellp-sec-head&quot;&gt;
   &lt;p class=&quot;ellp-eyebrow&quot;&gt;Your options at South Sacramento&lt;/p&gt;

   &lt;p class=&quot;ellp-lede&quot;&gt;Both are offered through East Lawn South Sacramento. Choose one to see how we can help, then call and a counselor will walk you through it.&lt;/p&gt;
  &lt;/div&gt;

   &lt;div class=&quot;ellp-seg&quot;&gt;
    &lt;label for=&quot;ellp-burial&quot;&gt;Burial&lt;/label&gt;
    &lt;label for=&quot;ellp-cremation&quot;&gt;Cremation&lt;/label&gt;
   &lt;/div&gt;

   &lt;!-- BURIAL PANEL --&gt;
   &lt;div class=&quot;ellp-panel ellp-panel--burial&quot;&gt;
    &lt;div class=&quot;ellp-feature&quot;&gt;
     &lt;div class=&quot;ellp-feature-media&quot;&gt;
      &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/South-Sac-Chapel-1024x683.webp&quot; srcset=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/South-Sac-Chapel-768x512.webp 768w, https://www.eastlawn.com/wp-content/uploads/2026/01/South-Sac-Chapel-1024x683.webp 1024w&quot; sizes=&quot;(min-width: 960px) 640px, 100vw&quot; width=&quot;1024&quot; height=&quot;683&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Pews and aisle inside the East Lawn South Sacramento chapel&quot;&gt;&lt;figcaption&gt;South Sacramento chapel&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2025/12/Beautiful-Cemetery-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Lawns and trees at East Lawn East Sacramento Cemetery&quot;&gt;&lt;figcaption&gt;East Sacramento Cemetery&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/HYPX-EL-2-2022-Crop-9-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;View down the aisle of the South Sacramento chapel toward the front&quot;&gt;&lt;figcaption&gt;Chapel, South Sacramento&lt;/figcaption&gt;&lt;/figure&gt;
     &lt;/div&gt;
     &lt;div class=&quot;ellp-feature-text&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;A chapel for your service, and East Lawn cemeteries for burial&lt;/h3&gt;
      &lt;p&gt;Our South Sacramento location is a funeral home with a large, beautiful chapel seating up to 225 people. There is no cemetery on this site. East Lawn has three heritage cemeteries, East Sacramento, Elk Grove and Sierra Hills, and a counselor can help you choose where your loved one rests.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Visitation and funeral service in our South Sacramento chapel&lt;/li&gt;
       &lt;li&gt;Burial at an East Lawn cemetery: East Sacramento, Elk Grove or Sierra Hills&lt;/li&gt;
       &lt;li&gt;We frequently honor veterans, alongside families of all faiths and backgrounds&lt;/li&gt;
      &lt;/ul&gt;
     &lt;/div&gt;
    &lt;/div&gt;

    &lt;p class=&quot;ellp-sub-h&quot;&gt;Burial services&lt;/p&gt;
    &lt;div class=&quot;ellp-cards&quot;&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Traditional Package&lt;/h3&gt;
      &lt;p&gt;A visitation, a funeral service and a committal service at the cemetery.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Visitation at East Lawn or another location&lt;/li&gt;
       &lt;li&gt;Funeral service at East Lawn or another location&lt;/li&gt;
       &lt;li&gt;Coach (hearse) and committal service at the cemetery&lt;/li&gt;
       &lt;li&gt;Embalming, care and preparation&lt;/li&gt;
       &lt;li&gt;Online funeral notice and obituary&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322026&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Service at Cemetery&lt;/h3&gt;
      &lt;p&gt;A graveside, cryptside or nicheside service at the final resting place, at one of our East Lawn cemeteries.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Committal service at the cemetery&lt;/li&gt;
       &lt;li&gt;Coach (hearse)&lt;/li&gt;
       &lt;li&gt;Care and preparation&lt;/li&gt;
       &lt;li&gt;Online funeral notice and obituary&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322026&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Immediate Burial&lt;/h3&gt;
      &lt;p&gt;Burial without a ceremony, scheduled by the funeral home. Family attendance at the grave is not included.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Transfer of your loved one into our care&lt;/li&gt;
       &lt;li&gt;Care and preparation&lt;/li&gt;
       &lt;li&gt;Coach (hearse)&lt;/li&gt;
       &lt;li&gt;Online funeral notice and obituary&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322026&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
    &lt;/div&gt;

    &lt;p class=&quot;ellp-sub-h&quot;&gt;Places of rest at East Lawn cemeteries&lt;/p&gt;
    &lt;ul class=&quot;ellp-rest&quot;&gt;
     &lt;li&gt;&lt;strong&gt;Ground burial&lt;/strong&gt;In-ground interment in one of our peaceful cemetery lawns, for full-body or urn placement.&lt;/li&gt;
     &lt;li&gt;&lt;strong&gt;Crypts&lt;/strong&gt;Above-ground placement in an elegant community or private mausoleum, offering protection and easy visitation.&lt;/li&gt;
     &lt;li&gt;&lt;strong&gt;Urn niches&lt;/strong&gt;Indoor and outdoor options, in-ground or above-ground, and glass-front niches for personalized display and lasting tribute.&lt;/li&gt;
    &lt;/ul&gt;

    &lt;div class=&quot;ellp-panel-cta&quot;&gt;
     &lt;p&gt;A family service counselor can explain every burial option and help you decide.&lt;/p&gt;
     &lt;a class=&quot;ellp-btn ellp-btn--light&quot; href=&quot;tel:+19167322026&quot;&gt;Call (916) 732-2026&lt;/a&gt;
    &lt;/div&gt;
   &lt;/div&gt;

   &lt;!-- CREMATION PANEL --&gt;
   &lt;div class=&quot;ellp-panel ellp-panel--cremation&quot;&gt;
    &lt;div class=&quot;ellp-feature&quot;&gt;
     &lt;div class=&quot;ellp-feature-media&quot;&gt;
      &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2025/12/Cremation-Services-1024x683.webp&quot; srcset=&quot;https://www.eastlawn.com/wp-content/uploads/2025/12/Cremation-Services-768x512.webp 768w, https://www.eastlawn.com/wp-content/uploads/2025/12/Cremation-Services-1024x683.webp 1024w&quot; sizes=&quot;(min-width: 960px) 640px, 100vw&quot; width=&quot;1024&quot; height=&quot;683&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Niche garden with a mosaic at East Lawn East Sacramento, where our crematory is located&quot;&gt;&lt;figcaption&gt;East Sacramento niche garden&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/HYPX-EL-2-2022-Crop-5-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Pews and aisle inside the East Lawn South Sacramento chapel&quot;&gt;&lt;figcaption&gt;South Sacramento chapel&lt;/figcaption&gt;&lt;/figure&gt;
      &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/East-Lawn-South-Sac-Receptions-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Reception hall with tables at East Lawn South Sacramento&quot;&gt;&lt;figcaption&gt;Reception hall&lt;/figcaption&gt;&lt;/figure&gt;
     &lt;/div&gt;
     &lt;div class=&quot;ellp-feature-text&quot;&gt;
      &lt;div class=&quot;ellp-callout&quot;&gt;
       &lt;h3 class=&quot;ellp-h3&quot;&gt;You can have a full funeral service with cremation.&lt;/h3&gt;
      &lt;/div&gt;
      &lt;p&gt;Choosing cremation does not mean giving up a service. Families can hold a visitation and a funeral with their loved one present, with cremation afterward. Cremation may take place before or after the funeral.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Performed at our owned East Sacramento crematory, so your loved one never leaves our care&lt;/li&gt;
       &lt;li&gt;Families are welcome to witness the cremation&lt;/li&gt;
       &lt;li&gt;Services in our South Sacramento chapel, which seats up to 225&lt;/li&gt;
      &lt;/ul&gt;
     &lt;/div&gt;
    &lt;/div&gt;

    &lt;p class=&quot;ellp-sub-h&quot;&gt;Cremation services&lt;/p&gt;
    &lt;div class=&quot;ellp-cards&quot;&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Traditional Service&lt;/h3&gt;
      &lt;p&gt;Visitation, a funeral service with your loved one present, and cremation afterward, for families who want a full ceremony and farewell.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Visitation at East Lawn or another location&lt;/li&gt;
       &lt;li&gt;Funeral service at East Lawn or another location&lt;/li&gt;
       &lt;li&gt;Use of AV equipment&lt;/li&gt;
       &lt;li&gt;Cremation, with a witness option&lt;/li&gt;
       &lt;li&gt;Online funeral notice and obituary&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322026&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Service At Cemetery&lt;/h3&gt;
      &lt;p&gt;A serene graveside, cryptside or nicheside committal service following cremation.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Cremation, with a witness option&lt;/li&gt;
       &lt;li&gt;Committal service at the cemetery&lt;/li&gt;
       &lt;li&gt;Care and preparation&lt;/li&gt;
       &lt;li&gt;Online funeral notice and obituary&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322026&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Remembrance Package&lt;/h3&gt;
      &lt;p&gt;A memorial service without the body present, centered on sharing tributes, memories and gatherings to honor your loved one&#x27;s life.&lt;/p&gt;
      &lt;ul class=&quot;ellp-checks&quot;&gt;
       &lt;li&gt;Memorial service at East Lawn or another location&lt;/li&gt;
       &lt;li&gt;Use of AV equipment&lt;/li&gt;
       &lt;li&gt;Cremation, with a witness option&lt;/li&gt;
       &lt;li&gt;Online funeral notice and obituary&lt;/li&gt;
      &lt;/ul&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322026&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
    &lt;/div&gt;
    &lt;div class=&quot;ellp-cards ellp-cards--2&quot;&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Respect Package&lt;/h3&gt;
      &lt;p&gt;A thoughtful direct cremation option with identification viewing and an engraved urn. No ceremony is included.&lt;/p&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322026&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
     &lt;article class=&quot;ellp-card&quot;&gt;
      &lt;h3 class=&quot;ellp-h3&quot;&gt;Direct Cremation&lt;/h3&gt;
      &lt;p&gt;A respectful option without ceremony or viewing, using an alternative container.&lt;/p&gt;
      &lt;div class=&quot;ellp-card-cta&quot;&gt;&lt;a href=&quot;tel:+19167322026&quot;&gt;Call a counselor&lt;/a&gt;&lt;/div&gt;
     &lt;/article&gt;
    &lt;/div&gt;

    &lt;div class=&quot;ellp-panel-cta&quot;&gt;
     &lt;p&gt;A family service counselor can explain every cremation option and help you decide.&lt;/p&gt;
     &lt;a class=&quot;ellp-btn ellp-btn--light&quot; href=&quot;tel:+19167322026&quot;&gt;Call (916) 732-2026&lt;/a&gt;
    &lt;/div&gt;
   &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;

&lt;section class=&quot;ellp-sec&quot; aria-labelledby=&quot;ellp-steps-h&quot;&gt;
 &lt;div class=&quot;ellp-wrap&quot;&gt;
  &lt;div class=&quot;ellp-sec-head&quot;&gt;
   &lt;p class=&quot;ellp-eyebrow&quot;&gt;If a death has occurred&lt;/p&gt;
   &lt;h2 class=&quot;ellp-h2&quot; id=&quot;ellp-steps-h&quot;&gt;What happens when you call&lt;/h2&gt;
  &lt;/div&gt;
  &lt;ol class=&quot;ellp-steps&quot; style=&quot;list-style:none;margin:0;padding:0&quot;&gt;
   &lt;li&gt;&lt;h3 class=&quot;ellp-h3&quot;&gt;Call us, day or night&lt;/h3&gt;&lt;p&gt;We are available 24/7 for immediate needs at &lt;a href=&quot;tel:+19167322026&quot;&gt;(916) 732-2026&lt;/a&gt;.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h3 class=&quot;ellp-h3&quot;&gt;We bring your loved one into our care&lt;/h3&gt;&lt;p&gt;We transfer your loved one into our care and gather the information we need.&lt;/p&gt;&lt;/li&gt;
   &lt;li&gt;&lt;h3 class=&quot;ellp-h3&quot;&gt;We guide you through planning&lt;/h3&gt;&lt;p&gt;We guide you through service planning, at a pace that is right for your family.&lt;/p&gt;&lt;/li&gt;
  &lt;/ol&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;ellp-sec ellp-sec--cream&quot; aria-labelledby=&quot;ellp-loc-h&quot;&gt;
 &lt;div class=&quot;ellp-wrap&quot;&gt;
  &lt;div class=&quot;ellp-loc&quot;&gt;
   &lt;div&gt;
    &lt;p class=&quot;ellp-eyebrow&quot;&gt;Welcome to our South Sacramento location&lt;/p&gt;
    &lt;h2 class=&quot;ellp-h2&quot; id=&quot;ellp-loc-h&quot; style=&quot;margin-bottom:18px&quot;&gt;East Lawn South Sacramento Funeral Home&lt;/h2&gt;
    &lt;p&gt;East Lawn South Sacramento proudly serves families throughout the Sacramento area with compassion and respect. This welcoming location features a large, beautiful chapel seating up to 225 people and a spacious reception area where families often gather after services to share memories and support one another.&lt;/p&gt;
    &lt;p&gt;We frequently honor veterans alongside families of all faiths and backgrounds. Our dedicated team provides dignified care for funerals, memorials, burials, cremation coordination, receptions, and pre-planning in a warm, family-oriented environment.&lt;/p&gt;
    &lt;p class=&quot;ellp-sub-h&quot; style=&quot;margin-top:28px&quot;&gt;Services at this location&lt;/p&gt;
    &lt;ul class=&quot;ellp-checks ellp-svc&quot;&gt;
     &lt;li&gt;Traditional funerals and celebrations of life&lt;/li&gt;
     &lt;li&gt;Receptions in our spacious reception hall with kitchen&lt;/li&gt;
     &lt;li&gt;Burial services, with interment at an East Lawn cemetery&lt;/li&gt;
     &lt;li&gt;Cremation coordination (with services at our East Sacramento crematory)&lt;/li&gt;
     &lt;li&gt;Video recording/live streaming and keepsake jewelry&lt;/li&gt;
     &lt;li&gt;Pre-planning guidance&lt;/li&gt;
    &lt;/ul&gt;
   &lt;/div&gt;
   &lt;div class=&quot;ellp-fac&quot;&gt;
    &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/South-Sac-Chapel-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;South Sacramento chapel with long wooden pews and a warm wood front wall&quot;&gt;&lt;figcaption&gt;&lt;strong&gt;Chapel&lt;/strong&gt;&lt;span&gt;Beautiful space seating 225 for services.&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/HYPX-EL-2-2022-Crop-16-Copy-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Stained glass wall along the side of the South Sacramento chapel&quot;&gt;&lt;figcaption&gt;&lt;strong&gt;Stained glass&lt;/strong&gt;&lt;span&gt;Colored light along the chapel wall.&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/East-Lawn-South-Sac-Receptions-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Reception hall at East Lawn South Sacramento with round tables and a wood floor&quot;&gt;&lt;figcaption&gt;&lt;strong&gt;Reception hall&lt;/strong&gt;&lt;span&gt;Warm, welcoming hall with kitchen.&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
    &lt;figure&gt;&lt;img src=&quot;https://www.eastlawn.com/wp-content/uploads/2026/01/HYPX-East-Lawn-1-25-39-1-768x512.webp&quot; width=&quot;768&quot; height=&quot;512&quot; loading=&quot;lazy&quot; decoding=&quot;async&quot; alt=&quot;Lobby seating area at East Lawn South Sacramento with sofas and lamps&quot;&gt;&lt;figcaption&gt;&lt;strong&gt;Lobby&lt;/strong&gt;&lt;span&gt;A comfortable place to gather.&lt;/span&gt;&lt;/figcaption&gt;&lt;/figure&gt;
   &lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;

&lt;section class=&quot;ellp-sec&quot; aria-labelledby=&quot;ellp-faq-h&quot;&gt;
 &lt;div class=&quot;ellp-wrap&quot;&gt;
  &lt;div class=&quot;ellp-sec-head&quot;&gt;
   &lt;p class=&quot;ellp-eyebrow&quot;&gt;Questions families ask&lt;/p&gt;
   &lt;h2 class=&quot;ellp-h2&quot; id=&quot;ellp-faq-h&quot;&gt;Frequently asked questions&lt;/h2&gt;
  &lt;/div&gt;
  &lt;div class=&quot;ellp-faq&quot;&gt;
   &lt;details open&gt;&lt;summary&gt;What should I do immediately when a loved one passes away?&lt;/summary&gt;&lt;p&gt;Call East Lawn right away. We are available 24/7 to serve families across Sacramento, Roseville, and Elk Grove. We will transfer your loved one into our care, gather necessary information, and guide you through service planning. For South Sacramento, call &lt;a href=&quot;tel:+19167322026&quot;&gt;(916) 732-2026&lt;/a&gt;.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Can we have a funeral service if we choose cremation?&lt;/summary&gt;&lt;p&gt;Yes. Our Traditional Service includes visitation, a funeral service with your loved one present, and cremation afterward. Cremation may take place before or after the funeral.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Does East Lawn have its own crematory?&lt;/summary&gt;&lt;p&gt;Yes. East Lawn operates its own crematory, ensuring that your loved one never leaves our care. Cremation for South Sacramento families is performed at our owned East Sacramento crematory.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Can family members witness the cremation?&lt;/summary&gt;&lt;p&gt;Yes. Families are welcome to witness the cremation if they choose.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Can services be held on weekends or evenings?&lt;/summary&gt;&lt;p&gt;Yes. We accommodate weekend and evening services for families throughout the greater Sacramento area.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Does East Lawn accept life insurance?&lt;/summary&gt;&lt;p&gt;Yes, we work directly with life insurance companies on behalf of families in the Sacramento region.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;What is the difference between a funeral, a memorial service, and a celebration of life?&lt;/summary&gt;&lt;p&gt;A funeral usually has the body or ashes present, often followed by burial or cremation. A memorial service is similar but without the body. A celebration of life is typically less formal and focuses on sharing stories and memories.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;We have a pre-need policy from another funeral home. Can East Lawn help?&lt;/summary&gt;&lt;p&gt;Yes. We honor and accept preneed funeral policies from other funeral homes.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Does East Lawn South Sacramento have a cemetery?&lt;/summary&gt;&lt;p&gt;This location is a funeral home with a chapel and reception hall. For burial, East Lawn has three heritage cemeteries: East Sacramento, Elk Grove and Sierra Hills. Cremation is performed at our owned East Sacramento crematory.&lt;/p&gt;&lt;/details&gt;
   &lt;details&gt;&lt;summary&gt;Can East Lawn help with Social Security and Veterans benefits?&lt;/summary&gt;&lt;p&gt;Yes. We assist families across Sacramento, Roseville, and Elk Grove with notifying agencies and completing benefit applications.&lt;/p&gt;&lt;/details&gt;
  &lt;/div&gt;
 &lt;/div&gt;
&lt;/section&gt;
