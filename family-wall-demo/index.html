<title>Family wall display - DEMO (example data)</title>

<script>
/* set the orientation before first paint so there is no flash */
(function(){var d=document.documentElement,p=window.matchMedia("(orientation: portrait)").matches;d.setAttribute("data-orient",p?"portrait":"landscape");d.setAttribute("data-theme","light");})();
</script>

<!-- DEMO build of the family wall display. Static, no backend, no network calls, no real accounts. Example data only.
     Demo PIN: 1234. Demo menu: tap the faint dots in the top right corner, or press and hold the clock. See README.md. -->
<div id="app"></div>
<div id="demo-layer" data-tour="0" data-menu="0" data-welcome="0"></div>
