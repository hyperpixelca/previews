<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;800&display=swap">

.rhr-ty *{box-sizing:border-box;margin:0;padding:0}

.rhr-ty .rhr-ty-back{display:inline-block;margin-top:28px;font-size:15px;font-weight:700;text-decoration:none;border-radius:999px;padding:10px 20px;border:1.5px solid var(--navy);color:var(--navy)}
@media (max-width:600px){
 .rhr-ty{padding:48px 0 56px}
 .rhr-ty h1{font-size:28px}

 .rhr-ty .rhr-ty-lede{font-size:17px}
